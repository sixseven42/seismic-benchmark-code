# Paired noise prediction: noisy input volume + noise label volume (same geometry).
# Metrics (SNR/PSNR/SSIM/...) compare denoised estimate (noisy - pred_noise) to reference signal (noisy - label_noise).
# Visualization still shows noisy input, predicted noise, and label noise.
# Set input_path / target_path; shapes must match after load_volume.
# Supported formats: segy_pair, npy_pair, mat_pair (pick one block).

experiment:
  name: denoise_dfb_cnn_base
  output_dir: /data/shared/benchmark/ground_roll/results
  seed: 42
  device: cuda:4

data:
  segy_pair:
    input_path: /cloud/cloud-s3fs/data/field/noisy/dagang_noisy_padded201_1.0.sgy
    target_path: /cloud/cloud-s3fs/data/field/noise/dagang_noise_padded201_1.0.sgy
    traces_per_shot: 201
    time_downsample: 1

  # Shot-level FFID split: 111 shots split 89 / 11 / 11 (no leakage).
  shot_split:
    train: 89
    val: 11
    test: 11

  loader:
    batch_size: 12
    num_workers: 4
    pin_memory: true

preprocess:
  # Spherical-divergence compensation is not applied in the denoise training script (raw amplitudes).
  normalize_mode: max_abs
  normalize_scope: global   # max_abs (and optional clip) is fit on noisy input only; same stats scale the noise label
  # clip_percentile: null  # optional; if set, clipping uses the noisy volume before stats
  patch_time: 256
  patch_trace: 128
  patch_overlap: 0.5
  max_shots: null

model:
  type: dfb_cnn
  params:
    in_channels: 1
    out_channels: 1
    lowpass_sigma: 1.5           # spatial sigma (px) for Gaussian low-pass; increase → lower cutoff
    v_max: 3200.0                 # max apparent velocity in RT domain (m/s)
    n_velocities: 0               # 0 → auto = patch_trace; set >0 for fixed velocity bins
    cnn1_kernel_size: 5           # CNN1 (low-freq): 5×5 kernel per paper
    cnn1_depth: 9                 # CNN1: 9 conv layers
    cnn1_base_channels: 100       # CNN1: 100 feature maps
    cnn2_kernel_size: 3           # CNN2 (high-freq): 3×3 kernel per paper
    cnn2_depth: 5                 # CNN2: 5 conv layers
    cnn2_base_channels: 64        # CNN2: 64 feature maps

loss:
  type: mse
  params:
    reduction: mean

metrics:
  # Computed on denoised vs reference signal in normalized space (input - pred vs input - target).
  # PSNR peak = 1.0 and SSIM range = 2.0 follow the existing [-1, 1] scale convention; tune if your residual signals span wider.
  - name: snr
    params: { reduction: per_sample }
  - name: psnr
    params: { data_range: 1.0, reduction: per_sample }
  - name: ssim
    params: { data_range: 2.0, window_size: 11, sigma: 1.5 }
  - name: mae
    params: {}
  - name: mse
    params: {}
  - name: rmse
    params: { reduction: per_sample }

optim:
  type: adamw
  params:
    lr: 1.0e-3                     # paper: exponential LR 1e-3 → 1e-5 over 50 epochs
    weight_decay: 1.0e-6

scheduler:
  type: cosine
  params:
    min_lr: 1.0e-5                 # paper minimum LR

train:
  epochs: 50                       # paper: 50 epochs
  grad_clip: 1.0
  log_step: false
  log_interval: 10
  eval_interval: 1
  ckpt_interval: 10
  vis_interval: 5
  resume: null

log:
  log_dir: logs
  plot_interval: 5
