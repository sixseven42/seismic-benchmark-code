# SANet: Soft Attention Network for ground-roll attenuation.
# Multi-branch convs (3×3, 5×5, 7×7) + soft attention + residual blocks.
# Model predicts ground-roll noise; denoised = noisy - pred_noise.
# Metrics compute on denoised signal (noisy - pred) vs reference (noisy - label).

experiment:
  name: denoise_sanet_base0822
  output_dir: /data/shared/benchmark/ground_roll/results_0822
  seed: 42
  device: cuda:4

data:
  segy_pair:
    input_path: /data/shared/benchmark/data/field/noisy/dagang_noisy_padded201_1.0.sgy
    target_path: /data/shared/benchmark/data/field/noise/dagang_noise_padded201_1.0.sgy
    traces_per_shot: 201
    time_downsample: 1

  shot_split:
    train: 89
    val: 11
    test: 11

  loader:
    batch_size: 128
    num_workers: 4
    pin_memory: true

preprocess:
  normalize_mode: max_abs
  normalize_scope: global
  patch_time: 256
  patch_trace: 128
  patch_overlap: 0.5
  max_shots: null

model:
  type: sanet
  params:
    in_channels: 1
    out_channels: 1
    base_channels: 32
    num_blocks: 8
    kernel_sizes: [3, 5, 7]

loss:
  type: mse
  params:
    reduction: mean

metrics:
  - name: snr
    params: { reduction: per_sample }
  - name: psnr
    params: { data_range: 1.0, reduction: per_sample }
  - name: ssim
    params: { data_range: 2.0, window_size: 11, sigma: 1.5 }
  - name: mae
    params: {}
  - name: mse
    params: {}
  - name: rmse
    params: { reduction: per_sample }

optim:
  type: adamw
  params:
    lr: 1.0e-4
    weight_decay: 1.0e-5

scheduler:
  type: cosine
  params:
    min_lr: 1.0e-6

train:
  epochs: 100
  grad_clip: 1.0
  log_step: false
  log_interval: 10
  eval_interval: 1
  ckpt_interval: 20
  vis_interval: 5
  resume: null

log:
  log_dir: logs
  plot_interval: 5
