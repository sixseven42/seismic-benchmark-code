# Pix2Pix cGAN for ground-roll attenuation.
# Generator predicts the additive noise component; denoised = noisy - pred_noise.
# Metrics compute on denoised signal (noisy - pred) vs reference (noisy - label).
# Set input_path / target_path; shapes must match after load_volume.
# Supported formats: segy_pair, npy_pair, mat_pair (pick one block).

experiment:
  name: denoise_pix2pix_base0521
  output_dir: /data/shared/benchmark/ground_roll/results_0510
  seed: 42
  device: cuda:4

data:
  segy_pair:
    input_path: /data/shared/benchmark/ground_roll/noisy/SEGC3_shots1_9_noisy_1.0.sgy
    target_path: /data/shared/benchmark/ground_roll/noise/SEGC3_shots1_9_noise_1.0.sgy  # noise label (supervised target)
    traces_per_shot: 201
    time_downsample: 1

  # Shot-level FFID split: first 7 → train, next 1 → val, last 1 → test (no leakage).
  shot_split:
    train: 7
    val: 1
    test: 1

  loader:
    batch_size: 256      # Pix2Pix is memory-heavy (G+D, 7-level U-Net)
    num_workers: 4
    pin_memory: true

preprocess:
  # Pix2Pix requires input in [-1, 1]; max_abs normalization matches this.
  normalize_mode: max_abs
  normalize_scope: global   # stats computed on noisy input, applied to noise label
  # clip_percentile: null  # optional
  patch_time: 256
  patch_trace: 128
  patch_overlap: 0.5
  max_shots: null

model:
  type: pix2pix_generator
  params:
    in_channels: 1
    out_channels: 1

discriminator:
  in_channels: 1

gan:
  lambda_l1: 100.0      # L1 regularization weight λ

metrics:
  - name: snr
    params: { reduction: per_sample }
  - name: psnr
    params: { data_range: 1.0, reduction: per_sample }
  - name: ssim
    params: { data_range: 2.0, window_size: 11, sigma: 1.5 }
  - name: mae
    params: {}
  - name: mse
    params: {}
  - name: rmse
    params: { reduction: per_sample }

optim:
  type: adam
  params:
    lr: 0.0002
    betas: [0.5, 0.999]

d_optim:
  type: adam
  params:
    lr: 0.0002
    betas: [0.5, 0.999]

scheduler:
  type: cosine
  params:
    min_lr: 1.0e-6

d_scheduler:
  type: cosine
  params:
    min_lr: 1.0e-6

train:
  epochs: 200
  grad_clip: null        # no gradient clipping (not used in original Pix2Pix)
  log_step: false
  log_interval: 10
  eval_interval: 1
  ckpt_interval: 20
  vis_interval: 5
  resume: null

log:
  log_dir: logs
  plot_interval: 5
