# Conditional DDPM (DDPM-2c) for ground-roll attenuation.
# Jointly models clean signal (x_0) and ground-roll noise (z_0) distributions.
# Model takes [noisy, x_t, z_t] as 3-channel input → predicts eps_sig, eps_gr.
# Metrics compute on denoised signal (x_0_pred) vs clean reference (noisy - label).
# Set input_path / target_path; shapes must match after load_volume.

experiment:
  name: denoise_ddpm_base0525
  output_dir: /data/shared/benchmark/ground_roll/results_0510
  seed: 42
  device: cuda:4

data:
  segy_pair:
    input_path: /data/shared/benchmark/ground_roll/noisy/SEGC3_shots1_9_noisy_1.0.sgy
    target_path: /data/shared/benchmark/ground_roll/noise/SEGC3_shots1_9_noise_1.0.sgy
    traces_per_shot: 201
    time_downsample: 1

  shot_split:
    train: 7
    val: 1
    test: 1

  loader:
    batch_size: 64        # DDPM is memory-heavy
    num_workers: 4
    pin_memory: true

preprocess:
  normalize_mode: max_abs
  normalize_scope: global
  patch_time: 256
  patch_trace: 128
  patch_overlap: 0.5
  max_shots: null

model:
  type: ddpm_unet
  params:
    in_channels: 3
    out_channels: 2
    base_channels: 64
    channel_mults: [1, 2, 4, 8, 8]
    time_emb_dim: 256
    num_res_blocks: 1

diffusion:
  num_timesteps: 1000
  beta_start: 1.0e-4
  beta_end: 0.02

metrics:
  - name: snr
    params: { reduction: per_sample }
  - name: psnr
    params: { data_range: 1.0, reduction: per_sample }
  - name: ssim
    params: { data_range: 2.0, window_size: 11, sigma: 1.5 }
  - name: mae
    params: {}
  - name: mse
    params: {}
  - name: rmse
    params: { reduction: per_sample }

optim:
  type: adam
  params:
    lr: 1.0e-4

scheduler:
  type: cosine
  params:
    min_lr: 1.0e-6

train:
  epochs: 63
  grad_clip: 1.0
  log_step: false
  log_interval: 10
  eval_interval: 1
  ckpt_interval: 20
  vis_interval: 0           # DDPM sampling is too slow for per-epoch viz
  eval_sample_steps: 50     # fewer steps for fast evaluation during training
  resume: null

log:
  log_dir: logs
  plot_interval: 5
