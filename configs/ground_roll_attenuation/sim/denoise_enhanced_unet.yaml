# Enhanced Attention U-Net with hybrid MSE+AFM loss for ground-roll attenuation.
# Model predicts the additive ground-roll noise component.
# Denoised = noisy_input - predicted_noise.
# Loss = MSE + lambda_afm * AFM (adaptive frequency modulation via torch.fft).
# Metrics compute on denoised signal vs clean reference (noisy - label).
# Set input_path / target_path; shapes must match after load_volume.

experiment:
  name: denoise_enhanced_atten_unet_base0521
  output_dir: /data/shared/benchmark/ground_roll/results_0510
  seed: 42
  device: cuda:4

data:
  segy_pair:
    input_path: /data/shared/benchmark/ground_roll/noisy/SEGC3_shots1_9_noisy_1.0.sgy
    target_path: /data/shared/benchmark/ground_roll/noise/SEGC3_shots1_9_noise_1.0.sgy
    traces_per_shot: 201
    time_downsample: 1

  shot_split:
    train: 7
    val: 1
    test: 1

  loader:
    batch_size: 24
    num_workers: 4
    pin_memory: true

preprocess:
  normalize_mode: max_abs
  normalize_scope: global
  patch_time: 256
  patch_trace: 128
  patch_overlap: 0.5
  max_shots: null

model:
  type: enhanced_atten_unet
  params:
    in_channels: 1
    out_channels: 1
    base_channels: 32
    depth: 4

loss:
  type: hybrid_mse_afm
  params:
    lambda_afm: 0.001

metrics:
  - name: snr
    params: { reduction: per_sample }
  - name: psnr
    params: { data_range: 1.0, reduction: per_sample }
  - name: ssim
    params: { data_range: 2.0, window_size: 11, sigma: 1.5 }
  - name: mae
    params: {}
  - name: mse
    params: {}
  - name: rmse
    params: { reduction: per_sample }

optim:
  type: adam
  params:
    lr: 1.0e-4

scheduler:
  type: cosine
  params:
    min_lr: 1.0e-6

train:
  epochs: 200
  grad_clip: 1.0
  log_step: false
  log_interval: 10
  eval_interval: 1
  ckpt_interval: 20
  vis_interval: 5
  resume: null

log:
  log_dir: logs
  plot_interval: 5
