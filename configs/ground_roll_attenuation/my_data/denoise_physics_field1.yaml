# Physics-constrained deep learning for ground-roll attenuation.
# Three CNNs (CNN1=signal, CNN2=ground-roll, CNN3=SW constraint) + f-k classifier.
# Two-phase training: (1) pre-train classifier, (2) train separation network.
# Model predicts clean signal X via CNN1; denoised = CNN1(noisy).
# Set input_path / target_path; shapes must match after load_volume.

experiment:
  name: denoise_physics_field1
  output_dir: /data/shared/benchmark/ground_roll/results_0803
  seed: 42
  device: cuda:4

data:
  segy_pair:
    input_path: /home/gaotianxiang/code/S_CNN/data/qinghai/raw/noisy/qinghai_noisy_1.0.sgy
    target_path: /home/gaotianxiang/code/S_CNN/data/qinghai/raw/noise/qinghai_noise_1.0.sgy
    traces_per_shot: 256
    time_downsample: 1

  # shot_split:
  #   train: 7
  #   val: 1
  #   test: 1

  loader:
    batch_size: 32          # physics model is memory-heavy (3 CNNs)
    num_workers: 4
    pin_memory: true

preprocess:
  normalize_mode: max_abs
  normalize_scope: global
  patch_time: 256
  patch_trace: 128
  patch_overlap: 0.5
  max_shots: null

model:
  type: physics_unet
  params:
    in_channels: 1
    out_channels: 1
    base_channels: 32
    num_levels: 3

fk_classifier:
  base_channels: 32
  dropout: 0.5
  lr: 1.0e-4
  epochs: 50
  batch_size: 64

physics_loss:
  lambda_signal_class: 0.1
  lambda_noise_class: 0.1
  lambda_recover_data: 0.5
  lambda_recover_noise_class: 0.1

metrics:
  - name: snr
    params: { reduction: per_sample }
  - name: psnr
    params: { data_range: 1.0, reduction: per_sample }
  - name: ssim
    params: { data_range: 2.0, window_size: 11, sigma: 1.5 }
  - name: mae
    params: {}
  - name: mse
    params: {}
  - name: rmse
    params: { reduction: per_sample }

optim:
  type: adam
  params:
    lr: 1.0e-4

scheduler:
  type: cosine
  params:
    min_lr: 1.0e-6

train:
  epochs: 100
  grad_clip: 1.0
  log_step: false
  log_interval: 10
  eval_interval: 1
  ckpt_interval: 20
  vis_interval: 0           # skip per-epoch viz (3-CNN forward is expensive)
  resume: null

log:
  log_dir: logs
  plot_interval: 5
