# Paired noise prediction using the Wang et al. DNNDAT encoder-decoder.
# The original paper used 2 input channels and 3 output channels; this config
# keeps the benchmark's existing single-input/single-target denoise convention.

experiment:
  name: denoise_dnndat_base0706
  output_dir: /data/shared/benchmark/multiples/results
  seed: 42
  device: cuda:4

data:
  segy_pair:
    input_path: /data/shared/benchmark/multiples/noisy/total_nodw.sgy
    target_path: /data/shared/benchmark/multiples/noise/multiples.sgy
    traces_per_shot: 638
    time_downsample: 1

  shot_split:
    train: 510
    val: 64
    test: 64

  loader:
    batch_size: 2
    num_workers: 4
    pin_memory: true

preprocess:
  normalize_mode: max_abs
  normalize_scope: global
  patch_time: 512
  patch_trace: 256
  patch_overlap: 0.5
  max_shots: null

model:
  type: dnndat
  params:
    in_channels: 1
    out_channels: 1
    dropout: 0.5
    upsample_mode: nearest
    final_activation: tanh

loss:
  type: mse
  params:
    reduction: mean

metrics:
  - name: snr
    params: { reduction: per_sample, min_signal_energy: 1.0e-8 }
  - name: psnr
    params: { data_range: 1.0, reduction: per_sample }
  - name: ssim
    params: { data_range: 2.0, window_size: 11, sigma: 1.5 }
  - name: mae
    params: {}
  - name: mse
    params: {}
  - name: rmse
    params: { reduction: per_sample }

optim:
  type: adamw
  params:
    lr: 1.0e-4
    weight_decay: 1.0e-5

scheduler:
  type: cosine
  params:
    min_lr: 1.0e-6

train:
  epochs: 200
  grad_clip: 1.0
  log_step: false
  log_interval: 10
  eval_interval: 1
  ckpt_interval: 20
  vis_interval: 5
  resume: null

log:
  log_dir: logs
  plot_interval: 5

